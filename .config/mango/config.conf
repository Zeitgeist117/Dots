exec_once = emacs --daemon & # emacs is a fully hackable system
#exec_once = waybar -c ~/.config/waybar/config-mango.jsonc & # status-bar
exec_once = qs & # status-bar
exec_once = awww-daemon & # wallpaper daemon
exec_once = cclipd & # clipboard
exec_once = xrdb ~/.Xresources & # set font and colors for terminal
exec_once = swp & # set wallpaper script 
exec_once = dunst & # notification daemon
exec_once = nm-applet & # system tray wifi widget
exec_once = corectrl & # overclock/undervolt gpu and fan control
exec_once = syncthing & # sync folders between devices
exec_once = pano-scrobbler & # scrobble music

root_color     = 0x282828ff   # gruvbox bg
border_color   = 0x504945ff   # gruvbox bg2 (inactive)
focus_color    = 0xebdbb2ff
urgent_color   = 0xad401fff
scratchpad_color = 0xebdbb2ff
drop_color     = 0x8FBA7C55
split_color    = 0xEB441EFF
maximized_screen_color = 0x89aa61ff
global_color   = 0xb153a7ff
overlay_color  = 0x14a57cff

border_px = 2
border_radius = 0

gap_inner_horizontal = 7
gap_inner_vertical = 7
gap_outer_horizontal = 7
gap_outer_vertical = 7

focused_opacity   = 1.0
unfocused_opacity = 1.0

blur                    = 0
blur_layer              = 1
blur_optimized          = 1
blur_params_num_passes  = 1
blur_params_radius      = 15
blur_params_noise       = 0.02
blur_params_brightness  = 0.9
blur_params_contrast    = 0.9
blur_params_saturation  = 1.2

shadows              = 0
layer_shadows        = 0
shadow_only_floating = 1
shadows_size         = 4
shadows_blur         = 4
shadows_position_x   = 0
shadows_position_y   = 0
shadows_color         = 0x1a1a1aee

animations       = 1
layer_animations = 1
animation_type_open  = slide
animation_type_close = slide
animation_fade_in  = 1
animation_fade_out = 1
tag_animation_direction = 1
animation_duration_move  = 500
animation_duration_open  = 400
animation_duration_tag   = 350
animation_duration_close = 800
animation_curve_open  = 0.23,1,0.32,1
animation_curve_move  = 0.23,1,0.32,1
animation_curve_close = 0.08,0.92,0,1
animation_curve_tag   = 0.46,1.0,0.29,1

tag_rule = id:1,layout_name:tile
tag_rule = id:2,layout_name:tile
tag_rule = id:3,layout_name:tile
tag_rule = id:4,layout_name:tile
tag_rule = id:5,layout_name:tile
tag_rule = id:6,layout_name:tile
tag_rule = id:7,layout_name:tile
tag_rule = id:8,layout_name:tile
tag_rule = id:9,layout_name:tile

new_is_master    = 0 # 0: current window will stay as master and not be pushed down the stack
default_master_factor = 0.5
default_master_count  = 1
smart_gaps       = 0

# App → tag assignments 
window_rule = title:Firefox,tags:3
window_rule = title:Discord,tags:4
window_rule = title:Steam,tags:5

# Float mpv
window_rule = title:Mpv,is_floating:1

# PiP
window_rule = title:^(Picture-in-Picture)$,is_floating:1

window_rule=is_term:1,no_swallow:0,app_id:foot

xkb_rules_layout = us
repeat_rate  = 25
repeat_delay = 600
cursor_size  = 24
sloppy_focus = 1
warp_cursor  = 1

focus_on_activate = 1
no_border_when_single = 0
enable_floating_snap  = 0
snap_distance = 30
drag_tile_to_tile = 1

# Reload
bind = SUPER+SHIFT,r, reload_config

# Launch apps
#bind = SUPER,SPACE,  spawn, rofi -show run
bind = SUPER,SPACE,  spawn, qs ipc call launcher toggle
bind = CTRL,SPACE,   spawn, vicinae toggle 
bind = SUPER,RETURN, spawn, foot
bind = SUPER,E,      spawn, thunar
bind = SUPER,V,      spawn, firefox
bind = SUPER,Y,      spawn, obsidian
bind = SUPER+SHIFT,P,      spawn, sioyek
bind = SUPER,APOSTROPHE, spawn, emacsclient -c

# Screenshots
bind = SUPER,S,            spawn, ~/.local/bin/scrw select
bind = SUPER+SHIFT,S,      spawn, ~/.local/bin/scrw full

# Define script
bind = SUPER+SHIFT,D,      spawn, ~/Documents/define

# Kill / quit
bind = SUPER,W,            killclient,
bind = SUPER+SHIFT,Q,      quit

# Toggle bar
# (needs the "bar" IpcHandler in the quickshell config)
bind = SUPER,B,            spawn, qs ipc call bar toggle

# Window state
bind = SUPER,M,            togglemaximizescreen,   # monocle / fullscreen
bind = SUPER,F,            togglefloating,
bind = SUPER+SHIFT,F,      togglefullscreen,
bind = SUPER,BACKSLASH,    togglefloating,

# Focus
bind = SUPER,J, focusstack, next
bind = SUPER,K, focusstack, prev

# Swap windows
bind = SUPER+SHIFT,J, exchange_stack_client, next
bind = SUPER+SHIFT,K, exchange_stack_client, prev

# Resize (same h/l as Hyprland)
bind = SUPER,H, resizewin, -30 0
bind = SUPER,L, resizewin, +30 0

# Workspace navigation (Left/Right arrows + Ctrl)
bind = SUPER,Left,         viewtoleft,  0
bind = SUPER,Right,        viewtoright, 0
bind = SUPER+SHIFT,H,      viewtoleft, 0
bind = SUPER+SHIFT,L,      viewtoright,0
bind = CTRL+SHIFT,H,       viewtoleft_have_client,  0
bind = CTRL+SHIFT,L,       viewtoright_have_client, 0

# Switch to tag by number
bind = SUPER,1, view, 1, 0
bind = SUPER,2, view, 2, 0
bind = SUPER,3, view, 3, 0
bind = SUPER,4, view, 4, 0
bind = SUPER,5, view, 5, 0
bind = SUPER,6, view, 6, 0
bind = SUPER,7, view, 7, 0
bind = SUPER,8, view, 8, 0
bind = SUPER,9, view, 9, 0

# Move window to tag
bind = SUPER+SHIFT,1, tag, 1, 0
bind = SUPER+SHIFT,2, tag, 2, 0
bind = SUPER+SHIFT,3, tag, 3, 0
bind = SUPER+SHIFT,4, tag, 4, 0
bind = SUPER+SHIFT,5, tag, 5, 0
bind = SUPER+SHIFT,6, tag, 6, 0
bind = SUPER+SHIFT,7, tag, 7, 0
bind = SUPER+SHIFT,8, tag, 8, 0
bind = SUPER+SHIFT,9, tag, 9, 0

mousebind = SUPER,btn_left,  moveresize, curmove
mousebind = SUPER,btn_right, moveresize, curresize

# Scroll through tags
axisbind = SUPER,UP,   viewtoleft_have_client
axisbind = SUPER,DOWN, viewtoright_have_client

bind = NONE,XF86AudioRaiseVolume, spawn, sh -c 'wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+ && ~/.local/bin/getvol'
bind = NONE,XF86AudioLowerVolume, spawn, sh -c 'wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%- && ~/.local/bin/getvol'
bind = NONE,XF86AudioMute,        spawn, sh -c 'wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle && ~/.local/bin/getvol'
bind = NONE,XF86AudioMicMute,     spawn, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

bind = NONE,XF86AudioPlay, spawn, playerctl -p kew,subtui,tauon,fooyin,DeaDBeeF,audacious,Feishin play-pause
bind = NONE,XF86AudioPrev, spawn, playerctl -p kew,subtui,tauon,fooyin,DeaDBeeF,audacious,Feishin previous
bind = NONE,XF86AudioNext, spawn, playerctl -p kew,subtui,tauon,fooyin,DeaDBeeF,audacious,Feishin next

window_rule=is_named_scratchpad:1,width:1000,height:800,app_id:scratch-term
window_rule=is_named_scratchpad:1,width:1000,height:800,app_id:scratch-term2
window_rule=is_named_scratchpad:1,width:1000,height:850,app_id:scratch-btop
window_rule=is_named_scratchpad:1,width:1000,height:800,app_id:scratch-wiremix
window_rule=is_named_scratchpad:1,width:1000,height:800,app_id:scratch-yazi
window_rule=is_named_scratchpad:1,width:1100,height:550,app_id:scratch-mus
window_rule=is_named_scratchpad:1,width:1000,height:650,app_id:scratch-tomato
window_rule=is_named_scratchpad:1,width:1000,height:650,app_id:scratch-rec
window_rule=is_named_scratchpad:1,width:500,height:650,app_id:scratch-bluetui

bind = SUPER,Z,        toggle_scratchpad       # built-in scratchpad

bind=SUPER,I,      toggle_named_scratchpad,scratch-term,none,foot --app-id=scratch-term
bind=SUPER,O,      toggle_named_scratchpad,scratch-term2,none,foot --app-id=scratch-term2
bind=SUPER,G,      toggle_named_scratchpad,scratch-btop,none,foot --app-id=scratch-btop -e btop
bind=SUPER,P,      toggle_named_scratchpad,scratch-wiremix,none,foot --app-id=scratch-wiremix -e wiremix
bind=SUPER,C,      toggle_named_scratchpad,scratch-yazi,none,foot --app-id=scratch-yazi -e yazi
bind=SUPER,N,      toggle_named_scratchpad,scratch-mus,none,foot --app-id=scratch-mus -e subtui
bind=SUPER,U,      toggle_named_scratchpad,scratch-tomato,none,foot --app-id=scratch-tomato -e tomato
bind=SUPER+SHIFT,B,toggle_named_scratchpad,scratch-bluetui,none,foot --app-id=scratch-bluetui -e bluetui
bind=SUPER,R,      toggle_named_scratchpad,scratch-rec,none,obs

layer_rule = animation_type_open:zoom,  layer_name:rofi
layer_rule = animation_type_close:zoom, layer_name:rofi
