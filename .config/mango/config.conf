# MangoWM config — ported from Hyprland
# https://github.com/DreamMaoMao/mango/wiki/

# ── Autostart ────────────────────────────────────────────────────────────────
exec-once = emacs --daemon &
exec-once = waybar -c ~/.config/waybar/config-mango.jsonc &
exec-once = awww-daemon &
exec-once = cclipd &
exec-once = xrdb ~/.Xresources &
exec-once = swp &
exec-once = dunst &
exec-once = nm-applet &
exec-once = corectrl &
exec-once = syncthing &
exec-once = pano-scrobbler &

# ── Appearance (gruvbox) ──────────────────────────────────────────────────────
rootcolor     = 0x282828ff   # gruvbox bg
bordercolor   = 0x504945ff   # gruvbox bg2 (inactive)
focuscolor 	  = 0xebdbb2ff
urgentcolor   = 0xad401fff
scratchpadcolor = 0xebdbb2ff
dropcolor     = 0x8FBA7C55
splitcolor    = 0xEB441EFF
maximizescreencolor = 0x89aa61ff
globalcolor   = 0xb153a7ff
overlaycolor  = 0x14a57cff

no_border_when_single=0
borderpx = 2
border_radius = 0

# ── Gaps ─────────────────────────────────────────────────────────────────────
gappih = 7
gappiv = 7
gappoh = 7
gappov = 7

# ── Opacity ───────────────────────────────────────────────────────────────────
focused_opacity   = 1.0
unfocused_opacity = 1.0

# ── Blur / Shadow ─────────────────────────────────────────────────────────────
blur                    = 1
blur_layer              = 1
blur_optimized          = 1
blur_params_num_passes  = 1
blur_params_radius      = 15
blur_params_noise       = 0.02
blur_params_brightness  = 0.9
blur_params_contrast    = 0.9
blur_params_saturation  = 1.2

shadows              = 0
layer_shadows        = 0
shadow_only_floating = 1
shadows_size         = 4
shadows_blur         = 4
shadows_position_x   = 0
shadows_position_y   = 0
shadowscolor         = 0x1a1a1aee

# ── Animations ────────────────────────────────────────────────────────────────
animations       = 1
layer_animations = 1
animation_type_open  = slide
animation_type_close = slide
animation_fade_in  = 1
animation_fade_out = 1
tag_animation_direction = 1
animation_duration_move  = 500
animation_duration_open  = 400
animation_duration_tag   = 350
animation_duration_close = 800
animation_curve_open  = 0.23,1,0.32,1
animation_curve_move  = 0.23,1,0.32,1
animation_curve_close = 0.08,0.92,0,1
animation_curve_tag   = 0.46,1.0,0.29,1

# ── Layouts ───────────────────────────────────────────────────────────────────
# Tile layout (master-stack equivalent)
tagrule = id:1,layout_name:tile
tagrule = id:2,layout_name:tile
tagrule = id:3,layout_name:tile
tagrule = id:4,layout_name:tile
tagrule = id:5,layout_name:tile
tagrule = id:6,layout_name:tile
tagrule = id:7,layout_name:tile
tagrule = id:8,layout_name:tile
tagrule = id:9,layout_name:tile

new_is_master    = 0
default_mfact    = 0.5
default_nmaster  = 1
smartgaps        = 5

# ── Input ─────────────────────────────────────────────────────────────────────
xkb_rules_layout = us
repeat_rate  = 25
repeat_delay = 600
cursor_size  = 24
sloppyfocus  = 1
warpcursor   = 1

# ── Misc ──────────────────────────────────────────────────────────────────────
focus_on_activate = 1
no_border_when_single = 0
enable_floating_snap  = 0
snap_distance = 30
drag_tile_to_tile = 1

# ── Programs ──────────────────────────────────────────────────────────────────
# Used in keybinds below
# $terminal   = foot
# $filemanager = pcmanfm
# $menu       = rofi -show run
# $browser    = firefox

# ── Keybinds ─────────────────────────────────────────────────────────────────

# Reload
bind = SUPER+SHIFT,r, reload_config

# Launch apps
bind = SUPER,SPACE,  spawn, rofi -show run
bind = SUPER,RETURN, spawn, foot
bind = SUPER,E,      spawn, pcmanfm
bind = SUPER,V,      spawn, firefox
bind = SUPER,Y,      spawn, obsidian
bind = SUPER,APOSTROPHE, spawn, emacsclient -c

# Screenshots
bind = SUPER,S,            spawn, ~/.local/bin/scrw select
bind = SUPER+SHIFT,S,      spawn, ~/.local/bin/scrw full

# Define script
bind = SUPER+SHIFT,D,      spawn, ~/Documents/define

# Kill / quit
bind = SUPER,W,            killclient,
bind = SUPER+SHIFT,Q,      quit

# Toggle bar (Super+B)
bind = SUPER,B,            spawn, pkill -SIGUSR1 waybar

# Window state
bind = SUPER,M,            togglemaximizescreen,   # monocle / fullscreen
bind = SUPER,F,            togglefullscreen,
bind = SUPER,BACKSLASH,    togglefloating,

# Focus (vim-style, same as Hyprland j/k)
bind = SUPER,J, focusstack, next
bind = SUPER,K, focusstack, prev

# Swap windows
bind = SUPER+SHIFT,J, exchange_client, down
bind = SUPER+SHIFT,K, exchange_client, up

# Resize (same h/l as Hyprland)
bind = SUPER,H, resizewin, -30 0
bind = SUPER,L, resizewin, +30 0

# Workspace navigation (Left/Right arrows + Ctrl)
bind = SUPER,Left,         viewtoleft,  0
bind = SUPER,Right,        viewtoright, 0
bind=SUPER+SHIFT,H		   ,viewtoleft, 0
bind=SUPER+SHIFT,L		   ,viewtoright,0
bind = CTRL,Left,          viewtoleft_have_client,  0
bind = CTRL,Right,         viewtoright_have_client, 0
bind = SUPER+SHIFT,H,      workspace, r-1   # same as Hyprland SUPER+SHIFT+H
bind = SUPER+SHIFT,L,      workspace, r+1   # same as Hyprland SUPER+SHIFT+L

# Switch to tag by number
bind = SUPER,1, view, 1, 0
bind = SUPER,2, view, 2, 0
bind = SUPER,3, view, 3, 0
bind = SUPER,4, view, 4, 0
bind = SUPER,5, view, 5, 0
bind = SUPER,6, view, 6, 0
bind = SUPER,7, view, 7, 0
bind = SUPER,8, view, 8, 0
bind = SUPER,9, view, 9, 0

# Move window to tag
bind = SUPER+SHIFT,1, tag, 1, 0
bind = SUPER+SHIFT,2, tag, 2, 0
bind = SUPER+SHIFT,3, tag, 3, 0
bind = SUPER+SHIFT,4, tag, 4, 0
bind = SUPER+SHIFT,5, tag, 5, 0
bind = SUPER+SHIFT,6, tag, 6, 0
bind = SUPER+SHIFT,7, tag, 7, 0
bind = SUPER+SHIFT,8, tag, 8, 0
bind = SUPER+SHIFT,9, tag, 9, 0

# Scratchpads
# MangoWM supports one built-in scratchpad (toggle_scratchpad / Super+Z)
# Additional scratchpads use the overlay system or floating spawns
windowrule=isnamedscratchpad:1,width:1000,height:800,appid:scratch-term
windowrule=isnamedscratchpad:1,width:1000,height:800,appid:scratch-term2
windowrule=isnamedscratchpad:1,width:1000,height:850,appid:scratch-btop
windowrule=isnamedscratchpad:1,width:1000,height:800,appid:scratch-wiremix
windowrule=isnamedscratchpad:1,width:1000,height:800,appid:scratch-yazi
windowrule=isnamedscratchpad:1,width:1100,height:450,appid:scratch-kew
windowrule=isnamedscratchpad:1,width:1000,height:650,appid:scratch-tomato
windowrule=isnamedscratchpad:1,width:500,height:650,appid:scratch-bluetui

bind = SUPER,Z,        toggle_scratchpad       # built-in scratchpad

bind=SUPER,I,      toggle_named_scratchpad,scratch-term,none,foot --app-id scratch-term
bind=SUPER,O,      toggle_named_scratchpad,scratch-term2,none,foot --app-id scratch-term2
bind=SUPER,G,      toggle_named_scratchpad,scratch-btop,none,foot --app-id scratch-btop -e btop
bind=SUPER,P,      toggle_named_scratchpad,scratch-wiremix,none,foot --app-id scratch-wiremix -e wiremix
bind=SUPER,C,      toggle_named_scratchpad,scratch-yazi,none,foot --app-id scratch-yazi -e yazi
bind=SUPER,N,      toggle_named_scratchpad,scratch-kew,none,foot --app-id scratch-kew -e kew
bind=SUPER,U,      toggle_named_scratchpad,scratch-tomato,none,foot --app-id scratch-tomato -e tomato
bind=SUPER+SHIFT,B,toggle_named_scratchpad,scratch-bluetui,none,foot --app-id scratch-bluetui -e bluetui

# Mouse binds
mousebind = SUPER,btn_left,  moveresize, curmove
mousebind = SUPER,btn_right, moveresize, curresize

# Scroll through tags
axisbind = SUPER,UP,   viewtoleft_have_client
axisbind = SUPER,DOWN, viewtoright_have_client

# Audio / media (same as Hyprland)
bind = NONE,XF86AudioRaiseVolume, spawn, sh -c 'wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+ && ~/.local/bin/getvol'
bind = NONE,XF86AudioLowerVolume, spawn, sh -c 'wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%- && ~/.local/bin/getvol'
bind = NONE,XF86AudioMute,        spawn, sh -c 'wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle && ~/.local/bin/getvol'
bind = NONE,XF86AudioMicMute,     spawn, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

bind = NONE,XF86AudioPlay, spawn, playerctl -p kew,tauon,fooyin,DeaDBeeF,audacious,Feishin play-pause
bind = NONE,XF86AudioPrev, spawn, playerctl -p kew,tauon,fooyin,DeaDBeeF,audacious,Feishin previous
bind = NONE,XF86AudioNext, spawn, playerctl -p kew,tauon,fooyin,DeaDBeeF,audacious,Feishin next

# ── Window rules ──────────────────────────────────────────────────────────────
# Float scratchpad-style terminals launched via keybinds above
windowrule = class:foot,float yes,size 1000 800

# App → tag assignments (matching Hyprland windowrules)
windowrule = class:firefox, tag 3
windowrule = class:discord, tag 4
windowrule = class:Steam,   tag 5

# Float mpv
windowrule = class:mpv, float yes

# PiP
windowrule = title:^(Picture-in-Picture)$, float yes

# ── Layer rules ───────────────────────────────────────────────────────────────
layerrule = animation_type_open:zoom,  layer_name:rofi
layerrule = animation_type_close:zoom, layer_name:rofi

